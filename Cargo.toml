# Adapted by CoreStory: standalone crate extracted from the Tauri plugins workspace.
[package]
name = "corestory-tauri-plugin-updater"
version = "0.1.0"
description = "Tauri updates with pluggable artifact verification and self_update manifests."
edition = "2024"
authors = ["CoreStory", "Tauri Programme within The Commons Conservancy"]
license = "Apache-2.0 OR MIT"
rust-version = "1.90"
repository = "https://github.com/corestory-oss/tauri-updater"
links = "tauri-plugin-updater"
keywords = ["tauri", "updater", "verification"]
categories = ["gui", "development-tools"]

[package.metadata.docs.rs]
no-default-features = true
features = ["zip"]

[package.metadata.platforms.support]
windows = { level = "full", notes = "" }
linux = { level = "full", notes = "" }
macos = { level = "full", notes = "" }
android = { level = "none", notes = "" }
ios = { level = "none", notes = "" }

[lib]
name = "tauri_plugin_updater"

[build-dependencies]
tauri-utils = { version = "2.10", features = ["build-2"] }

[dev-dependencies]
tauri = { version = "2.12", default-features = false, features = ["wry", "test"] }

[dependencies]
tauri = { version = "2.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
thiserror = { version = "2" }
log = { version = "0.4.21" }
tokio = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
], optional = true }
url = { version = "2" }
http = "1"
minisign-verify = "0.3"
time = { version = "0.3", features = ["parsing", "formatting"] }
base64 = "0.23"
semver = { version = "1", features = ["serde"] }
futures-util = "0.3"
tempfile = "3.20"
infer = "0.22"
percent-encoding = "2.3"

[target."cfg(target_os = \"windows\")".dependencies]
zip = { version = "9", default-features = false, optional = true }
windows-sys = { version = "0.61.0", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
] }

[target."cfg(target_os = \"linux\")".dependencies]
dirs = "7"
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }

[target."cfg(target_os = \"macos\")".dependencies]
libc = "0.2"
tar = "0.4"
flate2 = "1"
osakit = { version = "0.3", features = ["full"] }

[features]
default = ["rustls-tls", "system-proxy", "zip"]
zip = ["dep:zip", "dep:tar", "dep:flate2"]
native-tls = ["reqwest/native-tls"]
native-tls-vendored = ["reqwest/native-tls-vendored"]
rustls-tls = ["reqwest/rustls-no-provider", "dep:rustls"]
system-proxy = ["reqwest/system-proxy"]

[workspace]
